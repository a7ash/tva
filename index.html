<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TVA – Audio Waveform</title>
  <style>
    body {
      background: #0f0f0f;
      color: green;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans-serif;
    }

    canvas {
      border: 5px dotted #333;
    }

    #playbtn  {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid grey;
      border-radius: 8px;
    }

    #pausebtn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid grey;
      border-radius: 8px;

    }

    #startmic {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: progress;
      border: 2px solid grey;
      border-radius: 8px;

    }

  </style>
</head>
<body>

  <canvas id="waveform" width="1440" height="600"></canvas>
  <button id="playbtn">Play </button>
  <button id="pausebtn">Pause</button>  
  <button id="startmic">Start Mic</button>

  <audio id="audio" src="audio.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
