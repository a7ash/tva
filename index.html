<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TVA – Audio Waveform</title>
  <style>
    body {
      background: #0f0f0f;
      color: whitesmoke;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: sans; 
      overflow: hidden; /* no scrolling */
    }

    canvas {
      border: 5px dotted #333;
    }

    #playbtn, #pausebtn, #startmic {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: 2px solid grey;
      border-radius: 8px;
      background: transparent;
      color: whitesmoke;
    }

    /* ---------- SWITCH STYLE ---------- */
    .switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #444;
      transition: 0.3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 28px;
      width: 28px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #888;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    /* ---------- LEFT CONTROLS ---------- */
    #leftControls {
      position: fixed;
      left: 20px;
      top: 80%;
      transform: translateY(0%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    /* ---------- RIGHT CONTROLS ---------- */
    #rightControls {
      position: fixed;
      right: 20px;
      top: 80%;
      transform: translateY(0%);
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }

    #rightControls span, #leftControls span {
      font-size: 14px;
      opacity: 0.8;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .auto-toggle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .auto-toggle .labels {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* style file input a bit */
    #fileInput {
      color: whitesmoke;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <canvas id="waveform" width="1440" height="600"></canvas> 
  <button id="playbtn">Play</button>
  <button id="pausebtn">Pause</button>  
  <button id="startmic">Start Mic</button>

  <!-- LEFT SIDE: Glow + File Picker -->
  <div id="leftControls">
    <span>Glow</span>
    <input type="range" id="glowSlider" min="0" max="100" value="30">

    <!-- ✅ NEW: MP3 file picker -->
    <span>Load MP3</span>
    <input type="file" id="fileInput" accept="audio/mpeg,audio/mp3,audio/*">
  </div>

  <!-- RIGHT SIDE CONTROLS -->
  <div id="rightControls">
    <!-- Smooth / Raw -->
    <div class="toggle-row">
      <span>Smooth</span>
      <label class="switch">
        <input type="checkbox" id="modeToggle">
        <span class="slider"></span>
      </label>
      <span>Raw</span>
    </div>

    <!-- AutoColour Toggle -->
    <div class="auto-toggle">
      <div class="labels">
        <span>Off</span>
        <label class="switch">
          <input type="checkbox" id="autoColorToggle">
          <span class="slider"></span>
        </label>
        <span>On</span>
      </div>
      <span>AutoColour</span>
    </div>

    <!-- Color Picker -->
    <input type="color" id="colorPicker" value="#36fffd">
  </div>

  <audio id="audio"></audio>

  <script src="script.js"></script>
</body>
</html>
